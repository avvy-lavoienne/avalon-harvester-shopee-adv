<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avalon Harvester</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #18181b;
      color: #d4d4d8;
      margin: 0;
      padding: 20px;
      width: 320px;
      height: 380px;
    }
    h2 { text-align: center; margin: 0 0 20px 0; color: #22c55e; }
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #btnStart {
      background-color: #22c55e;
      color: black;
    }
    #btnStart:hover { background-color: #4ade80; }
    #btnStop {
      background-color: #ef4444;
      color: white;
    }
    #btnStop:hover { background-color: #f87171; }
    #status {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      padding: 12px;
      background-color: #27272a;
      border-radius: 6px;
      min-height: 50px;
    }
    #errorMsg {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background-color: #450a0a;
      color: #fda4af;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Avalon Harvester</h2>
  
  <button id="btnStart">🚀 START AUTO HARVEST</button>
  <button id="btnStop">⛔ STOP HARVESTING</button>

  <div id="status">Status: Idle</div>
  <div id="errorMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
