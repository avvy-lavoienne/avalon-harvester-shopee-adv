<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avalon Harvester</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #18181b;
      color: #d4d4d8;
      margin: 0;
      padding: 20px;
      width: 320px;
      min-height: 380px;
    }
    h2 { text-align: center; margin: 0 0 16px 0; color: #22c55e; font-size: 18px; }
    .field-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
    }
    .field-row label {
      font-size: 12px;
      color: #a1a1aa;
      white-space: nowrap;
    }
    .field-row input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      background: #27272a;
      color: #d4d4d8;
      font-size: 13px;
      outline: none;
    }
    .field-row input:focus { border-color: #22c55e; }
    .field-row input:disabled { opacity: 0.6; }
    .lock-btn {
      background: none;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 16px;
      width: auto;
      margin: 0;
    }
    .lock-btn:hover { background: #3f3f46; }
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #btnStart {
      background-color: #22c55e;
      color: black;
    }
    #btnStart:hover { background-color: #4ade80; }
    #btnStop {
      background-color: #ef4444;
      color: white;
    }
    #btnStop:hover { background-color: #f87171; }
    #status {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      padding: 12px;
      background-color: #27272a;
      border-radius: 6px;
      min-height: 50px;
    }
    #errorMsg {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background-color: #450a0a;
      color: #fda4af;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Avalon Harvester</h2>

  <div class="field-row">
    <label>Harvester:</label>
    <input type="text" id="harvesterUsername" placeholder="cth: worker-1" disabled>
    <button class="lock-btn" id="btnLock">🔓</button>
  </div>

  <button id="btnStart">🚀 START AUTO HARVEST</button>
  <button id="btnStop">⛔ STOP HARVESTING</button>

  <div id="status">Status: Idle</div>
  <div id="errorMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
